<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk - RizkiStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-indigo-600 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="index.html" class="text-2xl font-bold tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-bag-shopping"></i> RizkiStore
                </a>
                <div class="hidden md:flex space-x-6 font-medium">
                    <a href="index.html" class="hover:text-indigo-200 transition">Beranda</a>
                    <a href="products.html" class="text-indigo-200 font-bold">Produk</a>
                    <a href="contact.html" class="hover:text-indigo-200 transition">Kontak</a>
                </div>
                <div class="flex items-center gap-4">
                    <a href="cart.html" class="relative p-2 hover:text-indigo-200 transition">
                        <i class="fa-solid fa-cart-shopping text-xl"></i>
                        <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- KATALOG CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
        <h1 class="text-3xl font-bold mb-6">Katalog Produk</h1>

        <!-- Filter & Search Bar -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-8 flex flex-col md:flex-row gap-4 justify-between items-center">
            <input type="text" id="search-input" placeholder="Cari nama produk..." class="w-full md:w-1/3 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <div class="flex gap-2 w-full md:w-auto">
                <select id="category-filter" class="w-full md:w-auto px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">Semua Kategori</option>
                    <option value="Elektronik">Elektronik</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Aksesoris">Aksesoris</option>
                </select>
            </div>
        </div>

        <!-- Grid Produk -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="all-products">
            <!-- Render via JavaScript -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-800 text-gray-300 mt-auto py-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs">
            &copy; 2026 Website_ecommerce_Rizki. All rights reserved.
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
